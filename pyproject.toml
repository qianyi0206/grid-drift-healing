[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-drift-healing"
version = "0.1.0"
description = "Probabilistic renewable/grid forecasting with drift detection and a Diebold-Mariano-gated self-healing retrain loop"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Qian Yi (qianyi0206)" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gdh-backtest = "grid_drift_healing.backtest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
